name: eval-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      # Replays the committed model responses: no API keys, no cost, same result every time.
      # A change to a prompt, model or document has no cached response, so the replay fails
      # and asks for a live run instead of guessing.
      # Note: once the first live cache is committed, remove the `hashFiles` guard below so
      # a PR cannot bypass the gate by deleting `cache/`.
      - name: Replay baseline and candidate
        if: github.event_name == 'pull_request' && hashFiles('cache/**/*.json') != ''
        run: |
          python -m evalgate run --config configs/baseline.toml --offline
          python -m evalgate run --config configs/candidate.toml --offline
      - name: Regression gate
        if: github.event_name == 'pull_request' && hashFiles('cache/**/*.json') != ''
        run: python -m evalgate compare runs/baseline runs/candidate --max-regressions 0
      - name: Judge calibration gate
        if: github.event_name == 'pull_request' && hashFiles('labels/baseline+candidate.jsonl') != ''
        run: python -m evalgate agreement runs/baseline runs/candidate --min-kappa 0.6
