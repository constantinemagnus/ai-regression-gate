[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-regression-gate"
version = "0.1.0"
description = "Catch silent quality regressions in a retrieval-based support bot before they ship."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
evalgate = "evalgate.cli:main"

[tool.setuptools]
packages = ["evalgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
